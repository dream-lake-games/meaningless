[package]
name = "meaningless"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.18"
avian2d = "0.5"
bevy_ecs_ldtk = "0.14"

[build-dependencies]
toml = "0.8"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
bevy = { version = "0.18", features = ["file_watcher"] }

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
